name: ci
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    name: Relative link check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check relative Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--offline --no-progress --include-fragments './**/*.md'"
          fail: true
  sigma:
    runs-on: ubuntu-latest
    name: Validate Sigma rules
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Structural validation
        run: |
          python3 - <<'PY'
          import glob, yaml, uuid, sys
          req = ["title", "id", "description", "logsource", "detection", "level"]
          bad = 0; ids = {}
          rules = sorted(glob.glob('detections/rules/**/*.yml', recursive=True))
          for f in rules:
              try:
                  d = yaml.safe_load(open(f))
              except Exception as e:
                  print("YAML FAIL", f, e); bad += 1; continue
              miss = [k for k in req if k not in d]
              if miss: print(f"{f}: missing {miss}"); bad += 1
              try: uuid.UUID(str(d.get("id")))
              except Exception: print(f"{f}: invalid id"); bad += 1
              if "condition" not in (d.get("detection") or {}):
                  print(f"{f}: no detection.condition"); bad += 1
              ids.setdefault(d.get("id"), []).append(f)
          for k, v in ids.items():
              if len(v) > 1: print("duplicate id", k, v); bad += 1
          print(f"rules checked: {len(rules)}  problems: {bad}")
          sys.exit(1 if bad else 0)
          PY
  yaml:
    runs-on: ubuntu-latest
    name: YAML validation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Validate YAML files
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True)):
              try: list(yaml.safe_load_all(open(f))); print("ok  ", f)
              except Exception as e: print("FAIL", f, e); bad += 1
          sys.exit(1 if bad else 0)
          PY
